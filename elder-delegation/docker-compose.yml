services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: delegation
      POSTGRES_USER: delegation
      POSTGRES_PASSWORD: delegation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/delegation
      DB_USER: delegation
      DB_PASSWORD: delegation
    ports:
      - "8080:8080"

volumes:
  pgdata:
